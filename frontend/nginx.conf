# Protocole d'origine : derrière le relais HTTPS (Caddy, en production), on
# transmet « https » reçu de lui ; sinon (usage local) le protocole de la requête.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photos jusqu'à 5 Mo (+ marge du formulaire)
    client_max_body_size 6m;

    # API, administration et fichiers statiques de l'admin : servis par Django
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Fichiers compilés (noms uniques) : mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 7d;
    }

    # Application : toute autre adresse renvoie vers index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
